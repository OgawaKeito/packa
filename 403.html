<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>アクセスできません - Packa</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
             font-family: "Hiragino Sans", "Yu Gothic", Meiryo, system-ui, sans-serif; line-height: 1.8; text-align: center; }
      .code { font-size: 72px; font-weight: 700; line-height: 1; letter-spacing: .04em; opacity: .85; }
      h1 { margin: 16px 0 12px; font-size: 22px; }
      p { margin: 4px 0; }
      a { display: inline-block; margin-top: 28px; padding: 10px 28px; border-radius: 999px; border: 1px solid currentColor;
          color: inherit; text-decoration: none; transition: opacity .2s ease, transform .16s cubic-bezier(.23, 1, .32, 1); }
      a:active { transform: scale(.97); }
      a:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
      @media (hover: hover) and (pointer: fine) { a:hover { opacity: .7; } }
      @media (prefers-reduced-motion: reduce) { a { transition: none; } }
    </style>
  </head>
  <body>
    <main>
      <div class="code">403</div>
      <h1>アクセスできません</h1>
      <p>このページは表示できません。</p>
      <p>お手数ですが、トップページからお探しください。</p>
      <a href="/">トップページへ</a>
    </main>
  </body>
</html>
